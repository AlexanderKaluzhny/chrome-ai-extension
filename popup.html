<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style/popup.css">
</head>
<body>
  <div class="popup-section">
    <label for="customPrompt">Custom instructions</label>
    <textarea id="customPrompt" rows="2" placeholder="e.g., Focus on key takeaways..."></textarea>
    <button id="summarizeBtn">Summarize Page</button>
  </div>

  <div class="popup-section">
    <button id="readBtn" class="secondary">Open Reader Panel</button>
  </div>

  <div id="summary"></div>

  <footer class="popup-footer">
    AI-powered page summarizer & word helper
  </footer>

  <script src="popup.js"></script>
</body>
</html>
